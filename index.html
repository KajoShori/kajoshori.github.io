        <!-- Custom Spotify-style Music Player -->
        <div class="music-player" id="musicPlayer">
            <div class="player-left">
                <img src="" alt="Album Cover" class="player-album-art" id="playerAlbumArt">
            </div>
            <div class="player-center">
                <span class="player-title" id="playerTitle"></span>
                <span class="player-artist" id="playerArtist"></span>
                <div class="player-controls-row">
                    <span class="player-time" id="playerCurrentTime">0:00</span>
                    <div class="player-progress-bar" id="progressBarContainer">
                        <div class="player-progress" id="playerProgress"></div>
                    </div>
                    <span class="player-time" id="playerDuration">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <button class="player-nav-btn" id="playerPrevBtn" aria-label="Previous">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button class="player-play-btn" id="playerPlayBtn" aria-label="Play/Pause">
                    <i class="fas fa-play" id="playerPlayIcon"></i>
                </button>
                <button class="player-nav-btn" id="playerNextBtn" aria-label="Next">
                    <i class="fas fa-forward-step"></i>
                </button>
            </div>
            <div class="player-queue">
                <span class="player-queue-item" id="playerNextTrack"></span>
                <span class="player-queue-item" id="playerPrevTrack"></span>
            </div>
            <audio id="audioPlayer" preload="metadata"></audio>
        </div>
    </section>

    <!-- Click-to-Start Overlay -->
    <div id="startOverlay" class="start-overlay">
        <div class="overlay-content">
            <div class="overlay-icon-wrapper">

                <i class="fa-solid fa-hand-pointer overlay-icon"></i>
            </div>

        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgmAudio" src="./assets/music/bgm.m4a" loop preload="auto"></audio>

    <!-- WeChat QR Modal -->
    <div id="wechat-modal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal-box">
            <button class="modal-close"
                onclick="document.getElementById('wechat-modal').style.display='none'">&times;</button>
            <img src="./assets/imgs/wechatqr.png" alt="WeChat QR Code" class="qr-image">
            <p class="modal-text">Scan to add me on WeChat (微信)</p>
        </div>
    </div>
